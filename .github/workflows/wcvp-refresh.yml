name: Stage WCVP taxonomy refresh
on:
  workflow_dispatch:
  schedule:
    - cron: '19 6 1 * *'
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/refresh_wcvp.py --network-config config/wcvp-refresh.json
      - uses: actions/upload-artifact@v4
        with:
          name: wcvp-reviewed-candidate
          path: data/refresh/
          retention-days: 90
